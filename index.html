  <style>
    :root {
      --card: #242529;
      --text: rgba(255, 255, 255, 0.69);
      --pad-page: 5rem;
      --pad-y: 6rem;
      --pad-x: 4rem;
      --gap-image: 2.25rem;
      --gap-title: 2rem;
      --gap-rule: 5rem;
      --icon-spacing: 1.375rem;
      --title-size: 4.375em;
    }

    * { box-sizing: border-box; }

    html { font-size: 14pt; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--pad-page);
      background: #e6e6e6;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Fixed layer so the photo doesn't stretch with page height on phones. */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(45deg, rgba(37, 21, 69, 0.145) 21%, rgba(212, 72, 107, 0.145) 62%, rgba(126, 37, 119, 0.145) 100%),
        url('assets/bg.jpg') center / cover no-repeat;
    }

    main {
      width: 30rem;
      max-width: 100%;
      padding: var(--pad-y) var(--pad-x);
      background: var(--card);
      border-radius: 1.875rem;
      box-shadow: 0 0 5.875rem 2.125rem rgba(0, 0, 0, 0.2);
      text-align: center;
      animation: rise 1s ease both;
    }

    .avatar {
      display: block;
      width: 7.75rem;
      height: auto;
      aspect-ratio: 1;
      margin: 0 auto var(--gap-image);
      border: 8px solid #9e9e9e;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      margin: 0 0 var(--gap-title);
      font-size: var(--title-size);
      font-weight: 600;
      line-height: 1;
      color: #fff;
      background: linear-gradient(30deg, #7a7a7a 0%, #fff 73%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      margin: 0;
      color: var(--text);
      line-height: 1.875;
    }

    strong { font-weight: 600; }

    hr {
      margin: var(--gap-rule) calc(var(--pad-x) * -1);
      border: 0;
      border-top: 2px dashed rgba(255, 255, 255, 0.051);
    }

    ul {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--icon-spacing);
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 2.25em;
    }

    ul a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2em;
      height: 2em;
      border-radius: 50%;
      background: #fff linear-gradient(30deg, #adadad 0%, rgba(255, 255, 255, 0.008) 100%);
      transition: transform 0.25s ease;
    }

    ul a:hover,
    ul a:focus-visible { transform: scale(1.1125); }

    ul svg {
      width: 60%;
      height: 60%;
      fill: rgba(36, 37, 41, 0.62);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(0.375rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
      ul a { transition: none; }
    }

    @media (max-width: 1280px) {
      :root { --pad-page: 3.5rem; }
    }

    @media (max-width: 980px) {
      html { font-size: 12pt; }
      :root { --pad-y: 3.5rem; --pad-x: 2rem; }
    }

    @media (max-width: 736px) {
      html { font-size: 11pt; }
      :root {
        --gap-image: 1.6875rem;
        --gap-title: 1.5rem;
        --gap-rule: 3.5rem;
        --title-size: 3.5em;
      }
    }

    @media (max-width: 480px) {
      :root { --pad-page: 2.25rem; --icon-spacing: 1.03125rem; }
    }

    @media (max-width: 360px) {
      :root { --pad-page: 2.0625rem; --pad-y: 2.625rem; --pad-x: 1.5rem; }
    }
  </style>
</head>
